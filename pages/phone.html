<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手机归属地查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-group input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e8eaed;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            background: #f8f9fa;
        }
        .input-group input:focus {
            border-color: #4a90d9;
            background: white;
        }
        .input-group input::placeholder {
            color: #bbb;
        }
        .input-group button {
            padding: 14px 24px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .input-group button:active {
            transform: scale(0.96);
            background: #3a7bc8;
        }
        .input-group button:disabled {
            background: #b0c4de;
            cursor: not-allowed;
        }
        #status {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        #status.loading {
            color: #4a90d9;
            background: #e8f0fe;
        }
        #status.success {
            color: #34a853;
            background: #e6f4ea;
        }
        #status.error {
            color: #ea4335;
            background: #fce8e6;
        }
        #result {
            padding: 18px 16px;
            border-radius: 12px;
            background: #f8f9fa;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s;
        }
        #result.has-data {
            background: #e8f0fe;
            border-left: 4px solid #4a90d9;
        }
        #result .placeholder {
            color: #bbb;
            text-align: center;
            font-size: 14px;
        }
        #result .field {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 15px;
        }
        #result .field:last-child {
            border-bottom: none;
        }
        #result .label {
            color: #666;
        }
        #result .value {
            color: #1a1a1a;
            font-weight: 500;
        }
        #result .value.highlight {
            color: #4a90d9;
            font-size: 17px;
        }
        .footer {
            text-align: center;
            margin-top: 18px;
            color: #ccc;
            font-size: 12px;
        }
        .examples {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .examples span {
            background: #f0f2f5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: background 0.2s;
        }
        .examples span:active {
            background: #dde0e4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 归属地查询</h1>
    <p class="subtitle">输入手机号 · 秒查运营商</p>

    <div class="input-group">
        <input type="tel" id="phoneInput" placeholder="输入11位手机号" maxlength="11" value="13800138000">
        <button id="queryBtn">查询</button>
    </div>

    <div id="status">⏳ 正在加载数据文件...</div>

    <div id="result">
        <div class="placeholder">输入号码后点击查询</div>
    </div>

    <div class="examples">
        <span onclick="setExample('13800138000')">13800138000</span>
        <span onclick="setExample('18888888888')">18888888888</span>
        <span onclick="setExample('13000000000')">13000000000</span>
    </div>
    <div class="footer">数据来源：phone.dat · 离线查询</div>
</div>

<script type="importmap">
{
    "imports": {
        "phone-number-cn": "https://cdn.jsdelivr.net/npm/phone-number-cn@1.0.1"
    }
}
</script>

<script type="module">
    import { PhoneDatManager } from 'phone-number-cn';

    // ========== 配置区域 ==========
    // 改成你的 Workers 代理地址（能访问到 phone.dat 的 URL）
    const DAT_URL = '../phone/phone.dat';
    // ==============================

    const phoneInput = document.getElementById('phoneInput');
    const queryBtn = document.getElementById('queryBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    let manager = new PhoneDatManager();
    let isReady = false;

    // ---------- 加载 dat 文件 ----------
    async function loadData() {
        setStatus('loading', '⏳ 正在下载数据文件，请稍候...');
        queryBtn.disabled = true;

        try {
            // 加时间戳防止缓存
            const url = `${DAT_URL}?t=${Date.now()}`;
            await manager.loadFromUrl(url);
            isReady = true;
            setStatus('success', '✅ 数据已加载，可以查询');
            queryBtn.disabled = false;
        } catch (err) {
            console.error('加载失败:', err);
            setStatus('error', '❌ 数据加载失败，请检查网络或刷新重试');
            queryBtn.disabled = true;
        }
    }

    // ---------- 查询归属地 ----------
    function queryPhone(phone) {
        // 清除空格和特殊字符
        const clean = phone.replace(/\s/g, '');
        
        // 验证长度（至少7位可以查询到号段归属）
        if (clean.length < 7) {
            showResult(null, '⚠️ 请输入至少7位号码');
            return;
        }

        if (!isReady) {
            showResult(null, '⏳ 数据还在加载，请稍候...');
            return;
        }

        try {
            const result = manager.lookup(clean);
            const info = result?.content;

            if (info && info.province) {
                // 构建归属地展示
                const province = info.province || '未知';
                const city = info.city || '';
                const isp = info.isp || '未知运营商';
                const zip = info.zip || '';
                const areaCode = info.areaCode || '';

                let location = province;
                if (city && city !== province) {
                    location += ` ${city}`;
                }

                showResult(info, null, { location, isp, zip, areaCode });
            } else {
                showResult(null, '❌ 未找到该号码的归属地信息');
            }
        } catch (err) {
            console.error('查询出错:', err);
            showResult(null, '❌ 查询出错，请重试');
        }
    }

    // ---------- UI 渲染 ----------
    function setStatus(type, text) {
        statusEl.textContent = text;
        statusEl.className = type;
    }

    function showResult(info, errorMsg, display) {
        if (errorMsg) {
            resultEl.className = '';
            resultEl.innerHTML = `<div style="color:#ea4335;text-align:center;">${errorMsg}</div>`;
            return;
        }

        if (display) {
            resultEl.className = 'has-data';
            resultEl.innerHTML = `
                <div class="field">
                    <span class="label">📍 归属地</span>
                    <span class="value highlight">${display.location}</span>
                </div>
                <div class="field">
                    <span class="label">📶 运营商</span>
                    <span class="value">${display.isp}</span>
                </div>
                ${display.zip ? `<div class="field"><span class="label">📮 邮编</span><span class="value">${display.zip}</span></div>` : ''}
                ${display.areaCode ? `<div class="field"><span class="label">📞 区号</span><span class="value">${display.areaCode}</span></div>` : ''}
            `;
        }
    }

    // ---------- 示例号码快捷填充 ----------
    window.setExample = function(num) {
        phoneInput.value = num;
        queryPhone(num);
    };

    // ---------- 事件绑定 ----------
    queryBtn.addEventListener('click', () => {
        queryPhone(phoneInput.value);
    });

    phoneInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            queryPhone(phoneInput.value);
        }
    });

    // 输入时自动格式化（只允许数字）
    phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/\D/g, '');
    });

    // ---------- 启动 ----------
    loadData();
</script>

</body>
</html>
