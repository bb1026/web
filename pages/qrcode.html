<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />

<title>二维码生成器</title>
<meta property="og:title" content="www.0515364.xyz">
<meta property="og:description" content="二维码生成">
<meta property="og:image" content="https://www.0515364.xyz/imgs/logo.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.0515364.xyz/pages/qrcode.html">
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f5f7fb;
  margin:0;
  padding:16px;
  max-width:760px;
  margin:auto;
}

h2{
  text-align:center;
  margin:10px 0 18px;
  font-size:20px;
}

/* 卡片 */
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
}

/* 类型选择 */
.row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.option{
  background:#f1f3f5;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  user-select:none;
}

.option.active{
  background:#2563eb;
  color:#fff;
}

/* ========== 浮动标签输入框 ========== */
.float-wrap{
  position:relative;
  margin-top:14px;
}
.float-wrap input,
.float-wrap textarea{
  width:100%;
  box-sizing:border-box;
  padding:14px 12px 8px 12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
  outline:none;
  background:#fff;
}
.float-wrap textarea{
  min-height:100px;
  resize:vertical;
}
.float-label{
  position:absolute;
  left:12px;
  top:14px;
  font-size:14px;
  color:#888;
  pointer-events:none;
  transition:0.2s ease;
}
/* 上浮状态 */
.float-wrap.focus .float-label,
.float-wrap.has-value .float-label{
  top:4px;
  left:10px;
  font-size:11px;
  color:#2563eb;
}
.float-wrap.focus input,
.float-wrap.focus textarea{
  border-color:#2563eb;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:15px;
}
#downloadBtn{
  background:#10b981;
  display:none;
}
#locBtn{
  background:#f97316;
  margin-top:14px;
}

/* QR */
#qr{
  text-align:center;
  margin-top:16px;
}

img{
  max-width:100%;
  border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.1);
}

/* WiFi segmented */
.enc-box{
  display:flex;
  gap:6px;
  margin-top:14px;
  background:#f1f3f5;
  padding:6px;
  border-radius:10px;
}

.enc-option{
  flex:1;
  text-align:center;
  padding:8px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  user-select:none;
}

.enc-option input{ display:none; }

.enc-option.active{
  background:#2563eb;
  color:#fff;
}
</style>
</head>

<body>

<h2>二维码生成器 Pro</h2>

<div class="card">
  <div class="row" id="typeBox">
    <div class="option active" data-type="text">文本</div>
    <div class="option" data-type="url">网址</div>
    <div class="option" data-type="tel">电话</div>
    <div class="option" data-type="sms">短信</div>
    <div class="option" data-type="email">邮件</div>
    <div class="option" data-type="wifi">WiFi</div>
    <div class="option" data-type="vcard">联系人</div>
    <div class="option" data-type="whatsapp">WhatsApp</div>
    <div class="option" data-type="geo">地图</div>
  </div>
</div>

<div class="card" id="inputs"></div>

<div class="card">
  <button onclick="gen()">生成二维码</button>
  <button id="downloadBtn" onclick="downloadQR()" style="margin-top:12px;">下载二维码</button>
</div>

<div id="qr"></div>

<script>
let type="text";
let qrSrc = "";

const inputs=document.getElementById("inputs");
const typeBox=document.getElementById("typeBox");
const downloadBtn = document.getElementById("downloadBtn");

// 绑定浮动标签事件
function bindFloat(el){
  const inp = el.querySelector('input,textarea');
  const wrap = el;
  function check(){
    if(inp.value.trim()!=='') wrap.classList.add('has-value');
    else wrap.classList.remove('has-value');
  }
  inp.addEventListener('focus',()=>{ wrap.classList.add('focus'); check(); });
  inp.addEventListener('blur',()=>{ wrap.classList.remove('focus'); check(); });
  inp.addEventListener('input',check);
  check();
}

function render(){
let html="";

if(type==="text") html=`
<div class="float-wrap">
  <label class="float-label">文本内容</label>
  <textarea id="text"></textarea>
</div>`;

if(type==="url") html=`
<div class="float-wrap">
  <label class="float-label">网址</label>
  <input id="url">
</div>`;

if(type==="tel") html=`
<div class="float-wrap">
  <label class="float-label">电话号码</label>
  <input id="tel">
</div>`;

if(type==="sms"){
html=`
<div class="float-wrap">
  <label class="float-label">接收手机号</label>
  <input id="sms_tel">
</div>
<div class="float-wrap">
  <label class="float-label">短信内容</label>
  <textarea id="sms_text"></textarea>
</div>
`;
}

if(type==="email"){
html=`
<div class="float-wrap">
  <label class="float-label">收件邮箱</label>
  <input id="email">
</div>
<div class="float-wrap">
  <label class="float-label">邮件主题</label>
  <input id="subject">
</div>
<div class="float-wrap">
  <label class="float-label">邮件正文</label>
  <textarea id="body"></textarea>
</div>
`;
}

if(type==="wifi"){
html=`
<div class="float-wrap">
  <label class="float-label">WiFi名称 SSID</label>
  <input id="ssid">
</div>
<div class="float-wrap">
  <label class="float-label">WiFi密码</label>
  <input id="password">
</div>
<div class="enc-box">
<div class="enc-option active"><input type="radio" name="enc" value="WPA" checked>WPA</div>
<div class="enc-option"><input type="radio" name="enc" value="WEP">WEP</div>
<div class="enc-option"><input type="radio" name="enc" value="nopass">无密码</div>
</div>
`;
}

if(type==="vcard"){
html=`
<div class="float-wrap">
  <label class="float-label">姓名</label>
  <input id="name">
</div>
<div class="float-wrap">
  <label class="float-label">电话</label>
  <input id="phone">
</div>
<div class="float-wrap">
  <label class="float-label">邮箱</label>
  <input id="email">
</div>
`;
}

if(type==="whatsapp"){
html=`
<div class="float-wrap">
  <label class="float-label">WhatsApp手机号</label>
  <input id="wa">
</div>
<div class="float-wrap">
  <label class="float-label">消息内容</label>
  <textarea id="wa_text"></textarea>
</div>
`;
}

if(type==="geo"){
html=`
<div class="float-wrap">
  <label class="float-label">纬度 Lat</label>
  <input id="lat">
</div>
<div class="float-wrap">
  <label class="float-label">经度 Lng</label>
  <input id="lng">
</div>
<button id="locBtn" onclick="getLocation()">📌 获取当前位置</button>
`;
}

inputs.innerHTML=html;
// 给所有浮动框绑定事件
document.querySelectorAll('.float-wrap').forEach(bindFloat);

// 切换类型时隐藏下载按钮
downloadBtn.style.display="none";
qrSrc = "";
}

typeBox.addEventListener("click",e=>{
const el=e.target.closest(".option");
if(!el) return;

document.querySelectorAll(".option").forEach(o=>o.classList.remove("active"));
el.classList.add("active");
type=el.dataset.type;
render();
});

render();

document.addEventListener("click",e=>{
if(e.target.closest(".enc-option")){
document.querySelectorAll(".enc-option").forEach(o=>o.classList.remove("active"));
const el=e.target.closest(".enc-option");
el.classList.add("active");
el.querySelector("input").checked=true;
}
});

// 获取地理位置
function getLocation(){
  if (!navigator.geolocation) {
    alert("你的浏览器不支持定位");
    return;
  }
  const btn = document.getElementById("locBtn");
  btn.textContent = "定位中...";
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById("lat").value = pos.coords.latitude.toFixed(6);
      document.getElementById("lng").value = pos.coords.longitude.toFixed(6);
      // 手动触发一次标签上浮
      document.querySelectorAll('#lat,#lng').forEach(inp=>{
        const w = inp.closest('.float-wrap');
        if(inp.value) w.classList.add('has-value');
      })
      btn.textContent = "📌 获取当前位置";
    },
    err => {
      btn.textContent = "📌 获取当前位置";
      let msg = "定位失败";
      if(err.code === 1) msg = "请允许位置权限";
      else if(err.code ===2) msg = "无法获取位置";
      else if(err.code ===3) msg = "定位超时";
      alert(msg);
    },
    {enableHighAccuracy:true,timeout:10000}
  )
}

function gen(){
let data="";

if(type==="text") data=document.getElementById("text").value;
if(type==="url") data=document.getElementById("url").value;
if(type==="tel") data="tel:"+document.getElementById("tel").value;

if(type==="sms"){
data=`SMSTO:${sms_tel.value}:${sms_text.value}`;
}

if(type==="email"){
data=`mailto:${email.value}?subject=${encodeURIComponent(subject.value)}&body=${encodeURIComponent(body.value)}`;
}

if(type==="wifi"){
const enc=document.querySelector('input[name="enc"]:checked').value;
data=`WIFI:T:${enc};S:${ssid.value};P:${password.value};;`;
}

if(type==="vcard"){
data=`BEGIN:VCARD
VERSION:3.0
FN:${name.value}
TEL:${phone.value}
EMAIL:${email.value}
END:VCARD`;
}

if(type==="whatsapp"){
data=`https://wa.me/${wa.value}?text=${encodeURIComponent(wa_text.value)}`;
}

if(type==="geo"){
data=`geo:${lat.value},${lng.value}`;
}

if(!data) return alert("请输入内容");

qrSrc = `https://qr.0515364.xyz/?data=${encodeURIComponent(data)}`;
document.getElementById("qr").innerHTML=`<img id="qrImg" src="${qrSrc}" width="260">`;
downloadBtn.style.display="block";
}

function downloadQR(){
const a = document.createElement('a');
a.href = qrSrc;
a.download = "qrcode.png";
a.target="_blank";
a.click();
}
</script>

</body>
</html>
